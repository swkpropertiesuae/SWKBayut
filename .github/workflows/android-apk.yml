name: Build SWK Rent Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      SWK_KEYSTORE_B64: ${{ secrets.SWK_KEYSTORE_B64 }}
      SWK_KEYSTORE_PASSWORD: ${{ secrets.SWK_KEYSTORE_PASSWORD }}
      SWK_KEY_ALIAS: ${{ secrets.SWK_KEY_ALIAS }}
      SWK_KEY_PASSWORD: ${{ secrets.SWK_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install, verify, and sync Web bundle into Android assets
        run: |
          npm install
          npm run typecheck
          npm test
          npm run android:sync

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Build Signed Release APK & Google Play Store AAB Bundle
        if: env.SWK_KEYSTORE_B64 != ''
        working-directory: android
        run: |
          echo "$SWK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/swk-release.jks"
          SWK_KEYSTORE_FILE="$RUNNER_TEMP/swk-release.jks" gradle assembleRelease bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swkrent-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Play Store AAB & Release APK
        if: env.SWK_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: swkrent-playstore-release-bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
